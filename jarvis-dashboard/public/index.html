<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Jarvis Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand">JARVIS<span>Marketing · Strategy · Info — local dashboard</span></div>
    <div class="header-actions">
      <span id="conn-status" class="conn-status offline">connecting…</span>
      <button type="button" id="reset" class="reset">New chat</button>
    </div>
  </header>

  <main>
    <section class="graph-panel">
      <div id="graph"></div>

      <div class="graph-toolbar">
        <button type="button" id="graph-refresh" title="Rebuild from live GHL/CallRail data">⟳ Refresh</button>
        <span id="graph-status" class="graph-status">loading…</span>
      </div>

      <div id="graph-legend" class="graph-legend"></div>

      <div class="cards-column">
        <div class="cards-toolbar">
          <button type="button" id="brief-new" title="Generate a new marketing brief now">+ New Brief</button>
          <button type="button" id="cards-clear" title="Dismiss all cards">Clear all</button>
        </div>
        <div id="cards"></div>
      </div>

      <div class="orb-widget">
        <div id="orb" class="orb idle">
          <div class="orb-ring"></div>
          <div class="orb-ring-sweep"></div>
          <div class="orb-core"></div>
          <div class="orb-particles">
            <div class="particle-orbit" style="--i:0"><span class="particle-dot"></span></div>
            <div class="particle-orbit" style="--i:1"><span class="particle-dot"></span></div>
            <div class="particle-orbit" style="--i:2"><span class="particle-dot"></span></div>
            <div class="particle-orbit" style="--i:3"><span class="particle-dot"></span></div>
            <div class="particle-orbit" style="--i:4"><span class="particle-dot"></span></div>
            <div class="particle-orbit" style="--i:5"><span class="particle-dot"></span></div>
            <div class="particle-orbit" style="--i:6"><span class="particle-dot"></span></div>
            <div class="particle-orbit" style="--i:7"><span class="particle-dot"></span></div>
            <div class="particle-orbit" style="--i:8"><span class="particle-dot"></span></div>
          </div>
        </div>
        <div id="orb-state" class="orb-state">IDLE</div>
      </div>
    </section>

    <section class="chat-panel">
      <div id="log"></div>
      <form id="form">
        <input type="text" id="input" placeholder="Ask about marketing, strategy, or info..." autocomplete="off" />
        <button type="button" id="mic" class="mic" title="Click to start hands-free voice mode">🎤</button>
        <button type="submit" id="send">Send</button>
      </form>
    </section>
  </main>

  <script src="/vendor/force-graph.min.js"></script>
  <script src="app.js"></script>
  <script src="graph-panel.js"></script>
  <script src="brief-cards.js"></script>
</body>
</html>
