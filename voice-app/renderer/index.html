<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Jarvis Lite — Marketing/Strategy/Info</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #14161a; color: #eee; }
  header { padding: 12px 16px; border-bottom: 1px solid #2a2d33; font-weight: 600; }
  header span { font-weight: 400; color: #9aa0aa; font-size: 12px; display: block; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 8px 12px; border-radius: 10px; line-height: 1.4; white-space: pre-wrap; }
  .user { align-self: flex-end; background: #2f6fed; color: white; }
  .assistant { align-self: flex-start; background: #23262c; }
  .status { align-self: flex-start; color: #9aa0aa; font-size: 12px; font-style: italic; }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #2a2d33; }
  input[type=text] { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #2a2d33; background: #1c1e23; color: #eee; }
  button { padding: 10px 14px; border-radius: 8px; border: none; background: #2f6fed; color: white; cursor: pointer; }
  button.mic.recording { background: #e0433a; }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <header>Jarvis Lite<span>Marketing · Strategy · Info only</span></header>
  <div id="log"></div>
  <form id="form">
    <input type="text" id="input" placeholder="Ask about marketing, strategy, or info..." autocomplete="off" />
    <button type="button" id="mic" class="mic">🎤</button>
    <button type="submit" id="send">Send</button>
  </form>
  <script src="renderer.js"></script>
</body>
</html>
