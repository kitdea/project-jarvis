<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Galaxy</title>
<style>
  :root {
    --panel: rgba(10, 14, 26, 0.82);
    --edge: rgba(120, 170, 255, 0.22);
    --text: #dCE6FF;
    --dim: #7f90b5;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #000; color: var(--text);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
  }
  #graph { position: fixed; inset: 0; }

  /* ---- title ---- */
  #title {
    position: fixed; top: 26px; left: 32px; z-index: 5; pointer-events: none;
  }
  #title h1 {
    margin: 0; font-size: 19px; font-weight: 600; letter-spacing: .18em;
    text-transform: uppercase;
    text-shadow: 0 0 22px rgba(120, 180, 255, .55);
  }
  #title p { margin: 5px 0 0; font-size: 12px; color: var(--dim); letter-spacing: .05em; }

  /* ---- legend ---- */
  #legend {
    position: fixed; bottom: 24px; left: 32px; z-index: 5;
    display: flex; flex-direction: column; gap: 7px;
    padding: 14px 16px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--edge);
    backdrop-filter: blur(9px); max-height: 42vh; overflow-y: auto;
  }
  .legend-row {
    display: flex; align-items: center; gap: 9px;
    font-size: 12px; color: var(--dim); cursor: pointer;
    transition: color .18s;
  }
  .legend-row:hover { color: var(--text); }
  .legend-dot {
    width: 9px; height: 9px; border-radius: 50%; flex: none;
    box-shadow: 0 0 9px currentColor;
  }
  .legend-count { margin-left: auto; padding-left: 14px; opacity: .6; font-variant-numeric: tabular-nums; }

  /* ---- side panel ---- */
  #panel {
    position: fixed; top: 0; right: 0; z-index: 10;
    width: min(420px, 92vw); height: 100%;
    padding: 34px 30px; overflow-y: auto;
    background: var(--panel); backdrop-filter: blur(16px);
    border-left: 1px solid var(--edge);
    transform: translateX(102%); transition: transform .45s cubic-bezier(.22,.9,.3,1);
  }
  #panel.open { transform: none; }
  #panel-group {
    display: inline-block; margin-bottom: 12px;
    padding: 4px 11px; border-radius: 999px;
    font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase;
    border: 1px solid currentColor;
  }
  #panel h2 { margin: 0 0 6px; font-size: 21px; line-height: 1.3; font-weight: 600; }
  #panel-path { margin: 0 0 22px; font-size: 11.5px; color: var(--dim); word-break: break-all; }
  #panel-excerpt {
    margin: 0; font-size: 13.5px; line-height: 1.75; color: #b9c6e4;
    white-space: pre-wrap;
  }
  .panel-label {
    margin: 28px 0 10px; font-size: 10.5px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--dim);
  }
  #panel-neighbors { list-style: none; margin: 0; padding: 0; }
  #panel-neighbors li {
    padding: 8px 11px; margin-bottom: 5px; border-radius: 8px; cursor: pointer;
    background: rgba(255,255,255,.035); border: 1px solid transparent;
    font-size: 12.5px; transition: background .16s, border-color .16s;
    display: flex; align-items: center; gap: 9px;
  }
  #panel-neighbors li:hover { background: rgba(255,255,255,.09); border-color: var(--edge); }
  #panel-close {
    position: absolute; top: 20px; right: 22px;
    width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
    background: transparent; border: 1px solid var(--edge); color: var(--dim);
    font-size: 17px; line-height: 1; transition: color .16s, border-color .16s;
  }
  #panel-close:hover { color: #fff; border-color: #fff; }

  #hint {
    position: fixed; bottom: 26px; right: 32px; z-index: 5;
    font-size: 11.5px; color: var(--dim); letter-spacing: .04em;
    transition: opacity .5s;
  }
  #loading {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
    background: #000; color: var(--dim); letter-spacing: .2em;
    text-transform: uppercase; font-size: 12px; transition: opacity .7s;
  }

  /* ---- ask bar ---- */
  #ask {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
    z-index: 12; width: min(680px, calc(100vw - 64px));
    display: flex; flex-direction: column; gap: 10px;
  }
  #ask-answer {
    display: none; padding: 16px 18px; border-radius: 14px;
    background: var(--panel); border: 1px solid var(--edge);
    backdrop-filter: blur(14px);
    font-size: 13.5px; line-height: 1.7; color: #c6d3ee;
    max-height: 34vh; overflow-y: auto;
    animation: ask-rise .32s cubic-bezier(.22,.9,.3,1);
  }
  #ask-answer.show { display: block; }
  #ask-answer.error { color: #ff9b9b; }
  @keyframes ask-rise {
    from { opacity: 0; transform: translateY(9px); }
    to   { opacity: 1; transform: none; }
  }
  #ask-sources {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 13px;
  }
  #ask-sources button {
    padding: 4px 10px; border-radius: 999px; cursor: pointer;
    background: rgba(255,255,255,.05); border: 1px solid var(--edge);
    color: var(--dim); font: inherit; font-size: 11.5px;
    transition: color .16s, border-color .16s, background .16s;
  }
  #ask-sources button:hover { color: #fff; background: rgba(255,255,255,.11); }
  #ask-bar {
    display: flex; align-items: center; gap: 10px;
    padding: 5px 6px 5px 18px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--edge);
    backdrop-filter: blur(14px);
    box-shadow: 0 8px 34px rgba(0, 0, 0, .55);
    transition: border-color .22s, box-shadow .22s;
  }
  #ask-bar:focus-within {
    border-color: rgba(140, 190, 255, .55);
    box-shadow: 0 8px 40px rgba(60, 120, 220, .3);
  }
  #ask-input {
    flex: 1; min-width: 0; background: none; border: 0; outline: none;
    color: var(--text); font: inherit; font-size: 14px; padding: 10px 0;
  }
  #ask-input::placeholder { color: var(--dim); }
  #ask-send {
    flex: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
    background: rgba(120, 180, 255, .16); border: 1px solid var(--edge);
    color: var(--text); font-size: 15px; line-height: 1;
    transition: background .16s, color .16s;
  }
  #ask-send:hover:not(:disabled) { background: rgba(120, 180, 255, .34); color: #fff; }
  #ask-send:disabled { opacity: .45; cursor: default; }
  #ask.busy #ask-input { opacity: .6; }

  /* ---- voice ---- */
  #ask-mic, #ask-mute {
    flex: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
    background: rgba(255, 255, 255, .05); border: 1px solid var(--edge);
    color: var(--dim); font-size: 15px; line-height: 1;
    transition: background .16s, color .16s, border-color .16s;
  }
  #ask-mic:hover:not(:disabled), #ask-mute:hover { color: #fff; background: rgba(255,255,255,.12); }
  #ask-mic:disabled { opacity: .35; cursor: default; }
  #ask-mic.listening {
    color: #fff; border-color: #ff6b9d;
    background: rgba(255, 107, 157, .3);
    animation: mic-pulse 1.3s ease-in-out infinite;
  }
  #ask-mute.muted { color: #ff9b9b; border-color: rgba(255,155,155,.5); }
  @keyframes mic-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 107, 157, .5); }
    50%      { box-shadow: 0 0 0 9px rgba(255, 107, 157, 0); }
  }
  #ask-status {
    display: none; align-self: center;
    padding: 5px 14px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--edge);
    backdrop-filter: blur(14px);
    font-size: 11.5px; letter-spacing: .06em; color: var(--dim);
  }
  #ask-status.show { display: block; }
  #ask-status .pip {
    display: inline-block; width: 7px; height: 7px; margin-right: 8px;
    border-radius: 50%; background: currentColor; vertical-align: middle;
    animation: pip-fade 1.1s ease-in-out infinite;
  }
  #ask-status.listening { color: #ff9bc7; border-color: rgba(255,107,157,.45); }
  #ask-status.thinking  { color: #9bc4ff; }
  #ask-status.speaking  { color: #7CFFB2; }
  @keyframes pip-fade { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }

  /* ---- arc reactor ----
     Bottom-right chest-plate reactor that pulses with Jarvis's voice. Its
     --level (0…1) is written every frame from an AnalyserNode reading the
     actual Piper audio (see driveReactor), so this is real amplitude rather
     than an animation approximating one. Registering --level as a number
     lets the idle keyframes interpolate it instead of stepping. */
  @property --level {
    syntax: '<number>';
    inherits: true;
    initial-value: 0;
  }

  #reactor {
    --level: 0;
    --hue: 205;
    position: fixed;
    right: 26px;
    bottom: 26px;
    width: 74px;
    height: 74px;
    z-index: 6;
    border-radius: 50%;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
    /* Scale and glow both ride the level so a loud syllable physically swells
       the reactor rather than only brightening it. */
    transform: scale(calc(1 + var(--level) * .07));
    filter: drop-shadow(0 0 calc(8px + var(--level) * 24px)
                        hsla(var(--hue), 100%, 66%, calc(.25 + var(--level) * .5)));
  }
  /* The graph canvas sits behind everything; on very narrow screens the
     reactor would collide with the centred ask bar, so stand it down. */
  @media (max-width: 620px) { #reactor { display: none; } }

  #reactor .reactor-housing {
    position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle, #080d16 56%, #121a28 74%, #05080e 100%);
    border: 1px solid hsla(var(--hue), 55%, 60%, .3);
    box-shadow: inset 0 0 10px 2px #03060a, inset 0 0 0 5px #0a1018;
  }

  /* Ring of light coils around the core. */
  #reactor .reactor-coils { position: absolute; inset: 10px; border-radius: 50%; }
  #reactor .reactor-coils span {
    position: absolute; top: 50%; left: 50%;
    width: 6px; height: 10px; margin: -5px 0 0 -3px; border-radius: 2px;
    background: linear-gradient(180deg,
      hsla(var(--hue), 95%, 85%, .95), hsla(var(--hue), 90%, 55%, .5));
    transform: rotate(calc(var(--c) * 36deg)) translateY(-22px);
    opacity: calc(.35 + var(--level) * .65);
    box-shadow: 0 0 calc(2px + var(--level) * 7px) hsla(var(--hue), 100%, 72%, .8);
  }

  /* Triangular inner frame — the reactor's signature silhouette. */
  #reactor .reactor-triangle {
    position: absolute; inset: 20px;
    clip-path: polygon(50% 3%, 96% 79%, 4% 79%);
    background: hsla(var(--hue), 92%, 72%, calc(.16 + var(--level) * .34));
  }
  #reactor .reactor-triangle::after {
    content: ''; position: absolute; inset: 6px;
    clip-path: polygon(50% 3%, 96% 79%, 4% 79%);
    background: #060a11;
  }

  /* White-hot centre. */
  #reactor .reactor-core {
    position: absolute; width: 21px; height: 21px; border-radius: 50%;
    background: radial-gradient(circle, #fff 0%,
      hsla(var(--hue), 100%, 90%, 1) 34%,
      hsla(var(--hue), 100%, 60%, .9) 68%,
      hsla(var(--hue), 100%, 48%, 0) 100%);
    transform: scale(calc(.76 + var(--level) * .44));
    box-shadow: 0 0 calc(6px + var(--level) * 20px) calc(1px + var(--level) * 4px)
                hsla(var(--hue), 100%, 72%, .72);
  }

  /* Halo that washes over the housing on loud syllables. */
  #reactor .reactor-bloom {
    position: absolute; inset: -12%; border-radius: 50%;
    background: radial-gradient(circle,
      hsla(var(--hue), 100%, 74%, .45) 0%, hsla(var(--hue), 100%, 62%, 0) 65%);
    opacity: calc(var(--level) * .85);
  }

  /* Standby breath so the reactor never reads as switched off. While speaking
     the level comes from the analyser, so the breath is dropped rather than
     have two sources fight over the same property. State hues match the
     existing #ask-status colours. */
  #reactor.idle    { animation: reactor-breathe 3.6s ease-in-out infinite; }
  #reactor.listening { --hue: 335; animation: reactor-breathe 1.5s ease-in-out infinite; }
  #reactor.thinking  { --hue: 220; animation: reactor-breathe 1s ease-in-out infinite; }
  #reactor.speaking  { --hue: 152; animation: none; }
  @keyframes reactor-breathe {
    0%, 100% { --level: .1; }
    50%      { --level: .3; }
  }

  @media (prefers-reduced-motion: reduce) {
    #reactor, #reactor.idle, #reactor.listening, #reactor.thinking {
      animation: none;
      transform: none;
    }
  }

  /* Keep the hint clear of the centred ask bar on narrow screens. */
  @media (max-width: 900px) { #hint { display: none; } }
</style>
</head>
<body>

<div id="graph"></div>

<div id="title">
  <h1>Knowledge Graph</h1>
  <p id="subtitle">&nbsp;</p>
</div>

<div id="legend"></div>
<div id="hint">drag to orbit &middot; scroll to zoom &middot; click a star</div>

<aside id="panel">
  <button id="panel-close" aria-label="Close">&times;</button>
  <span id="panel-group"></span>
  <h2 id="panel-title"></h2>
  <p id="panel-path"></p>
  <p id="panel-excerpt"></p>
  <div id="neighbors-wrap" hidden>
    <div class="panel-label" id="neighbors-label">Connected notes</div>
    <ul id="panel-neighbors"></ul>
  </div>
</aside>

<div id="ask">
  <div id="ask-answer"></div>
  <div id="ask-status" role="status" aria-live="polite"></div>
  <div id="ask-bar">
    <input id="ask-input" type="text" autocomplete="off" spellcheck="false"
           placeholder="Ask your notes anything…">
    <button id="ask-mute" aria-label="Mute spoken answers" title="Mute spoken answers">&#128266;</button>
    <button id="ask-mic" aria-label="Speak your question" title="Speak your question">&#127908;</button>
    <button id="ask-send" aria-label="Ask">&#8593;</button>
  </div>
</div>

<div id="reactor" class="idle" aria-hidden="true">
  <div class="reactor-housing"></div>
  <div class="reactor-coils">
    <span style="--c:0"></span><span style="--c:1"></span><span style="--c:2"></span>
    <span style="--c:3"></span><span style="--c:4"></span><span style="--c:5"></span>
    <span style="--c:6"></span><span style="--c:7"></span><span style="--c:8"></span>
    <span style="--c:9"></span>
  </div>
  <div class="reactor-triangle"></div>
  <div class="reactor-core"></div>
  <div class="reactor-bloom"></div>
</div>

<div id="loading">Mapping the knowledge graph…</div>

<script src="graph-data.js"></script>

<!--
  Both libraries are loaded as ES modules off one import map so exactly one
  copy of three.js exists on the page. The old UMD pair (build/three.min.js +
  the 3d-force-graph UMD bundle, which inlines its own three) produced two
  instances: three warns about that, and the two copies fail each other's
  `instanceof` checks. `?external=three` keeps 3d-force-graph and its
  transitive deps pointed at the single "three" mapped below.

  Two pins matter here, so don't bump either casually:
    * three stays at 0.152.2, the version this viewer was written against.
    * three-render-objects is held at 1.29.0 because 1.30+ statically imports
      `three/webgpu`, which does not exist in r152 — letting it float resolves
      to a 404 and takes down the whole module graph.
  The "three/" trailing-slash entry covers the examples/jsm subpaths that
  three-render-objects pulls in (Fly/Orbit/Trackball controls, EffectComposer,
  RenderPass) without naming each one.
-->
<script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@0.152.2",
    "three/": "https://esm.sh/three@0.152.2/",
    "3d-force-graph":
      "https://esm.sh/3d-force-graph@1.73.0?external=three&deps=three-render-objects@1.29.0"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import ForceGraph3D from "3d-force-graph";

(function () {
  "use strict";

  var PALETTE = [
    "#5BC8FF", "#FF7BD5", "#7CFFB2", "#FFC86B",
    "#B18BFF", "#FF8B6B", "#5FE3E0", "#FFE066",
    "#8AA6FF", "#FF6B9D"
  ];

  var nodes = GRAPH.nodes;
  var links = GRAPH.links;

  // ---- colour by group ------------------------------------------------
  var groups = [];
  nodes.forEach(function (n) {
    if (groups.indexOf(n.group) === -1) groups.push(n.group);
  });
  groups.sort();
  var colorOf = {};
  groups.forEach(function (g, i) { colorOf[g] = PALETTE[i % PALETTE.length]; });

  // ---- adjacency, keyed by numeric id == index in nodes ---------------
  var neighbors = nodes.map(function () { return []; });
  var linkKeys = {};
  function idOf(end) { return typeof end === "object" ? end.id : end; }

  links.forEach(function (l) {
    var s = idOf(l.source), t = idOf(l.target);
    if (neighbors[s].indexOf(t) === -1) neighbors[s].push(t);
    if (neighbors[t].indexOf(s) === -1) neighbors[t].push(s);
    linkKeys[s + "-" + t] = true;
  });
  function linkTouches(l, id) {
    return idOf(l.source) === id || idOf(l.target) === id;
  }
  // In cluster mode a link counts as "hot" only when BOTH ends are cited, so
  // the lit edges trace the reasoning between sources rather than every stray
  // link hanging off them.
  function linkInCluster(l) {
    return inCluster[idOf(l.source)] && inCluster[idOf(l.target)];
  }
  function linkHot(l) {
    if (cluster.length) return linkInCluster(l);
    return selected !== null && linkTouches(l, selected);
  }

  var degree = nodes.map(function (n, i) { return neighbors[i].length; });
  var maxDegree = Math.max.apply(null, degree.concat([1]));

  var selected = null;
  // When an answer cites several notes, the whole set stays lit instead of a
  // single node + its neighbors. Empty means "no cluster active".
  var cluster = [];
  var inCluster = {};

  // ---- starfield ------------------------------------------------------
  function starfield() {
    var geo = new THREE.BufferGeometry();
    var count = 5200, pos = new Float32Array(count * 3);
    for (var i = 0; i < count; i++) {
      // Distribute on a wide shell so stars sit well behind the graph.
      var r = 2600 + Math.random() * 5200;
      var theta = Math.random() * Math.PI * 2;
      var phi = Math.acos(2 * Math.random() - 1);
      pos[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
      pos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
      pos[i * 3 + 2] = r * Math.cos(phi);
    }
    geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    return new THREE.Points(geo, new THREE.PointsMaterial({
      color: 0xffffff, size: 2.4, sizeAttenuation: false,
      transparent: true, opacity: 0.75, depthWrite: false
    }));
  }

  // ---- glowing node sprite -------------------------------------------
  var textureCache = {};
  function glowTexture(hex) {
    if (textureCache[hex]) return textureCache[hex];
    var size = 128, cv = document.createElement("canvas");
    cv.width = cv.height = size;
    var ctx = cv.getContext("2d");
    var g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    g.addColorStop(0.00, "rgba(255,255,255,1)");
    g.addColorStop(0.18, hex);
    g.addColorStop(0.45, hex);
    g.addColorStop(1.00, "rgba(0,0,0,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, size, size);
    var tex = new THREE.CanvasTexture(cv);
    textureCache[hex] = tex;
    return tex;
  }

  function nodeObject(node) {
    var mat = new THREE.SpriteMaterial({
      map: glowTexture(colorOf[node.group]),
      transparent: true, depthWrite: false,
      blending: THREE.AdditiveBlending
    });
    var sprite = new THREE.Sprite(mat);
    var scale = 9 + (degree[node.id] / maxDegree) * 17;
    sprite.scale.set(scale, scale, 1);
    sprite.__baseScale = scale;
    node.__sprite = sprite;
    return sprite;
  }

  // ---- graph ----------------------------------------------------------
  var elem = document.getElementById("graph");
  var Graph = ForceGraph3D()(elem)
    .backgroundColor("#000004")
    .graphData({ nodes: nodes, links: links })
    .nodeId("id")
    .nodeLabel(function (n) { return n.label; })
    .nodeThreeObject(nodeObject)
    .linkColor(function (l) {
      if (selected === null && !cluster.length) return "rgba(120,160,220,0.16)";
      if (!linkHot(l)) return "rgba(90,110,150,0.05)";
      // Colour a hot link by the group of the node anchoring the highlight.
      var anchor = cluster.length ? cluster[0] : selected;
      return colorOf[nodes[anchor].group];
    })
    .linkWidth(function (l) { return linkHot(l) ? 1.4 : 0.4; })
    .linkOpacity(0.55)
    .linkDirectionalParticles(function (l) { return linkHot(l) ? 3 : 0; })
    .linkDirectionalParticleWidth(1.6)
    .linkDirectionalParticleSpeed(0.006)
    .onNodeClick(function (n) { select(n.id, true); })
    .onBackgroundClick(function () { clearSelection(); });

  Graph.d3Force("charge").strength(-165);
  Graph.d3Force("link").distance(function (l) {
    return idOf(l.source) === idOf(l.target) ? 40 : 62;
  });

  Graph.scene().add(starfield());

  // Soften the default lighting so the additive sprites carry the image.
  Graph.scene().add(new THREE.AmbientLight(0x666f8a, 1.1));

  // ---- selection ------------------------------------------------------
  function applyHighlight() {
    nodes.forEach(function (n) {
      var sprite = n.__sprite;
      if (!sprite) return;
      var base = sprite.__baseScale;
      var opacity = 1, scale = base;
      if (cluster.length) {
        // Every cited note burns equally bright; everything else recedes.
        if (inCluster[n.id]) {
          scale = base * (n.id === selected ? 1.75 : 1.5);
        } else {
          opacity = 0.1;
          scale = base * 0.75;
        }
      } else if (selected !== null) {
        if (n.id === selected) {
          scale = base * 1.75;
        } else if (neighbors[selected].indexOf(n.id) !== -1) {
          scale = base * 1.15;
        } else {
          opacity = 0.16;
          scale = base * 0.8;
        }
      }
      sprite.material.opacity = opacity;
      sprite.scale.set(scale, scale, 1);
    });
    // Re-evaluate link accessors against the new selection.
    Graph.linkColor(Graph.linkColor())
         .linkWidth(Graph.linkWidth())
         .linkDirectionalParticles(Graph.linkDirectionalParticles());
  }

  function flyTo(node) {
    var dist = 155;
    var r = Math.hypot(node.x || 0, node.y || 0, node.z || 0) || 1;
    var ratio = 1 + dist / r;
    Graph.cameraPosition(
      { x: (node.x || 0) * ratio, y: (node.y || 0) * ratio, z: (node.z || 0) * ratio },
      node,
      1100
    );
  }

  // Pull back far enough that every cited note is in frame: aim at the group's
  // centroid and set the distance from how far the outliers sit from it.
  function flyToCluster(ids) {
    var cx = 0, cy = 0, cz = 0, n = ids.length;
    ids.forEach(function (id) {
      var node = nodes[id];
      cx += node.x || 0; cy += node.y || 0; cz += node.z || 0;
    });
    cx /= n; cy /= n; cz /= n;

    var spread = 0;
    ids.forEach(function (id) {
      var node = nodes[id];
      spread = Math.max(spread, Math.hypot((node.x || 0) - cx,
                                           (node.y || 0) - cy,
                                           (node.z || 0) - cz));
    });
    var dist = Math.max(240, spread * 2.4);
    var r = Math.hypot(cx, cy, cz);
    var camPos;
    if (r > 1) {
      // Normal case: back off outward along the centroid's own direction.
      var ratio = 1 + dist / r;
      camPos = { x: cx * ratio, y: cy * ratio, z: cz * ratio };
    } else {
      // The centroid sits (near enough) on the origin — scaling it would leave
      // the camera on top of its own target. Back off along where the camera
      // already is instead, which also keeps the move visually continuous.
      var cam = Graph.camera();
      var cr = Math.hypot(cam.position.x, cam.position.y, cam.position.z) || 1;
      var ux = cam.position.x / cr, uy = cam.position.y / cr, uz = cam.position.z / cr;
      camPos = { x: cx + ux * dist, y: cy + uy * dist, z: cz + uz * dist };
    }
    Graph.cameraPosition(camPos, { x: cx, y: cy, z: cz }, 1200);
  }

  function select(id, fly) {
    // A manual click is a new intent — drop any answer cluster still lit.
    cluster = [];
    inCluster = {};
    selectInternal(id, fly);
  }

  function selectInternal(id, fly) {
    selected = id;
    var node = nodes[id];           // id is the array index, by construction
    applyHighlight();
    if (fly) flyTo(node);
    openPanel(node);
  }

  // Light the notes an answer drew on. One-to-three sources: fly to the top hit
  // and let its neighbours glow. Four or more: frame the whole cluster instead,
  // since diving at one node would hide the breadth the answer actually used.
  var CLUSTER_MIN = 4;
  function showEvidence(ids) {
    var valid = ids.filter(function (id) {
      return typeof id === "number" && nodes[id];
    });
    if (!valid.length) return;

    if (valid.length >= CLUSTER_MIN) {
      cluster = valid;
      inCluster = {};
      valid.forEach(function (id) { inCluster[id] = true; });
      selected = valid[0];
      applyHighlight();
      flyToCluster(valid);
      openPanel(nodes[valid[0]], valid);
    } else {
      select(valid[0], true);
    }
  }

  // Focus one note. If it belongs to the evidence cluster currently lit, the
  // cluster stays up and only the camera and panel move; otherwise this is an
  // ordinary selection and the cluster is dropped.
  function focusNote(id) {
    if (cluster.length && inCluster[id]) {
      selected = id;
      applyHighlight();
      flyTo(nodes[id]);
      openPanel(nodes[id], cluster);
    } else {
      select(id, true);
    }
  }

  // ---- live growth ----------------------------------------------------
  // A note filed through /remember is spliced into the running graph rather
  // than waiting for a rebuild and a reload. The server assigns the new id as
  // nodes.length, matching build.py's numbering, so it drops straight into the
  // same index-is-id contract everything else here relies on.

  // A newborn star pulses so the eye catches where it landed. Driven off the
  // sprite scale rather than a CSS animation, since the node lives in WebGL.
  var PULSE_MS = 2600;
  function pulse(node) {
    var sprite = node.__sprite;
    if (!sprite) return;
    var base = sprite.__baseScale, start = Date.now();
    (function step() {
      var t = (Date.now() - start) / PULSE_MS;
      if (t >= 1 || node.__sprite !== sprite) {
        // Hand the scale back to applyHighlight rather than forcing base: the
        // node is normally selected by now, and its highlight scale must win.
        applyHighlight();
        return;
      }
      // Three decaying throbs: big on arrival, settling into place.
      var throb = Math.sin(t * Math.PI * 6) * (1 - t);
      sprite.scale.setScalar(base * (1.75 + throb * 1.3));
      requestAnimationFrame(step);
    })();
  }

  function birthNode(node, anchor, related) {
    if (!node || typeof node.id !== "number" || nodes[node.id]) return null;

    // Born at its closest relative's position (nudged off it so the force
    // layout has a direction to push in), then eased outward by the sim.
    var seed = (typeof anchor === "number" && nodes[anchor]) ? nodes[anchor] : null;
    var jitter = function () { return (Math.random() - 0.5) * 24; };
    node.x = (seed ? seed.x || 0 : 0) + jitter();
    node.y = (seed ? seed.y || 0 : 0) + jitter();
    node.z = (seed ? seed.z || 0 : 0) + jitter();

    nodes.push(node);
    neighbors.push([]);
    degree.push(0);
    if (colorOf[node.group] === undefined) {
      groups.push(node.group);
      colorOf[node.group] = PALETTE[(groups.length - 1) % PALETTE.length];
    }

    (related || []).forEach(function (other) {
      if (typeof other !== "number" || !nodes[other] || other === node.id) return;
      var key = Math.min(node.id, other) + "-" + Math.max(node.id, other);
      if (linkKeys[key]) return;
      linkKeys[key] = true;
      links.push({ source: node.id, target: other, reason: "capture" });
      neighbors[node.id].push(other);
      neighbors[other].push(node.id);
      degree[node.id]++;
      degree[other]++;
    });

    // nodeObject sizes a sprite against maxDegree, so refresh it before the
    // graph is handed back the enlarged node list.
    maxDegree = Math.max.apply(null, degree.concat([1]));

    // Reheat the layout so the new star and its edges settle visibly instead of
    // appearing frozen in place.
    Graph.graphData({ nodes: nodes, links: links });
    updateSubtitle();
    return node;
  }

  function clearSelection() {
    selected = null;
    cluster = [];
    inCluster = {};
    applyHighlight();
    document.getElementById("panel").classList.remove("open");
  }

  // ---- side panel -----------------------------------------------------
  var panel = document.getElementById("panel");
  var neighborsWrap = document.getElementById("neighbors-wrap");
  var neighborList = document.getElementById("panel-neighbors");
  var neighborsLabel = document.getElementById("neighbors-label");

  function openPanel(node, citedIds) {
    var color = colorOf[node.group];
    var tag = document.getElementById("panel-group");
    tag.textContent = node.group;
    tag.style.color = color;
    document.getElementById("panel-title").textContent = node.label;
    document.getElementById("panel-path").textContent = node.path;
    document.getElementById("panel-excerpt").textContent =
      node.excerpt || "(no readable text in this note)";

    neighborList.innerHTML = "";
    // With a cluster lit, the useful list is the other notes the answer used —
    // the graph neighbours are noise next to that.
    var linked, listLabel;
    if (citedIds && citedIds.length) {
      linked = citedIds.filter(function (nid) { return nid !== node.id; });
      listLabel = "Also sourced from";
    } else {
      linked = neighbors[node.id].slice().sort(function (a, b) {
        return nodes[a].label.localeCompare(nodes[b].label);
      });
      listLabel = "Connected notes";
    }
    neighborsLabel.textContent = listLabel;
    linked.forEach(function (nid) {
      var other = nodes[nid];
      var li = document.createElement("li");
      var dot = document.createElement("span");
      dot.className = "legend-dot";
      dot.style.color = colorOf[other.group];
      dot.style.background = colorOf[other.group];
      li.appendChild(dot);
      li.appendChild(document.createTextNode(other.label));
      // Inside a cluster, stepping to a sibling keeps the cluster lit.
      li.addEventListener("click", function () { focusNote(nid); });
      neighborList.appendChild(li);
    });
    neighborsWrap.hidden = linked.length === 0;
    panel.classList.add("open");
  }

  document.getElementById("panel-close").addEventListener("click", clearSelection);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      // Escape is the panic button for a long spoken answer as well.
      if (window.__jarvisHush) window.__jarvisHush();
      clearSelection();
    }
  });

  // ---- legend ---------------------------------------------------------
  var legend = document.getElementById("legend");
  function legendRow(g, count) {
    var row = document.createElement("div");
    row.className = "legend-row";
    var dot = document.createElement("span");
    dot.className = "legend-dot";
    dot.style.background = colorOf[g];
    dot.style.color = colorOf[g];
    var name = document.createElement("span");
    name.textContent = g;
    var num = document.createElement("span");
    num.className = "legend-count";
    num.textContent = count;
    row.appendChild(dot);
    row.appendChild(name);
    row.appendChild(num);
    row.addEventListener("click", function () {
      // Focus the most-connected note in this group.
      var best = null;
      nodes.forEach(function (n) {
        if (n.group === g && (best === null || degree[n.id] > degree[best])) best = n.id;
      });
      if (best !== null) select(best, true);
    });
    return row;
  }

  // Recomputed rather than written once, so a note filed mid-session updates the
  // counts and can add a legend row for a group that did not exist before.
  function updateSubtitle() {
    document.getElementById("subtitle").textContent =
      nodes.length + " notes · " + links.length + " connections · " +
      groups.length + " clusters";
    var counts = {};
    nodes.forEach(function (n) { counts[n.group] = (counts[n.group] || 0) + 1; });
    legend.innerHTML = "";
    groups.forEach(function (g) { legend.appendChild(legendRow(g, counts[g])); });
  }
  updateSubtitle();

  // ---- slow idle drift ------------------------------------------------
  var idleAngle = 0, lastFrame = Date.now(), interacting = false;
  var radius = 620;

  elem.addEventListener("pointerdown", function () { interacting = true; });
  elem.addEventListener("wheel", function () { interacting = true; }, { passive: true });

  Graph.cameraPosition({ x: 0, y: 0, z: radius });

  (function drift() {
    requestAnimationFrame(drift);
    var now = Date.now();
    var dt = Math.min(now - lastFrame, 100) / 1000;
    lastFrame = now;
    // Drift only while nothing is selected and the user isn't steering,
    // so it never fights a click-to-fly or a manual orbit.
    if (interacting || selected !== null) return;
    idleAngle += dt * 0.045;
    var cam = Graph.camera();
    var r = Math.hypot(cam.position.x, cam.position.z) || radius;
    cam.position.x = Math.sin(idleAngle) * r;
    cam.position.z = Math.cos(idleAngle) * r;
    cam.lookAt(0, 0, 0);
  })();

  // Resume drifting a while after the user lets go.
  ["pointerup", "wheel"].forEach(function (evt) {
    elem.addEventListener(evt, function () {
      clearTimeout(elem.__idleTimer);
      elem.__idleTimer = setTimeout(function () { interacting = false; }, 4500);
    }, { passive: true });
  });

  // ---- ask bar --------------------------------------------------------
  // The answer comes from POST /chat, which runs the local `claude` CLI
  // server-side. Nothing about the model or any credential reaches this page.
  var askBox = document.getElementById("ask");
  var askInput = document.getElementById("ask-input");
  var askSend = document.getElementById("ask-send");
  var askAnswer = document.getElementById("ask-answer");
  var sessionId = null;   // assigned by the server on the first answer
  var asking = false;

  // server.py serves this page AND answers /chat. Opening the file through any
  // other static server (VS Code Live Server, `python -m http.server`, file://)
  // renders the galaxy fine but leaves the ask bar with nothing to talk to.
  var CHAT_PORT = "4700";
  var WRONG_SERVER =
    "This page isn't being served by server.py, so there's no /chat to answer. " +
    "You're on port " + (location.port || "none (file://)") +
    " — open http://localhost:" + CHAT_PORT + " instead.";

  function showAnswer(text, isError) {
    askAnswer.textContent = "";
    askAnswer.classList.toggle("error", !!isError);
    askAnswer.classList.add("show");
    askAnswer.appendChild(document.createTextNode(text));
  }

  function showSources(ids) {
    if (!ids || !ids.length) return;
    var wrap = document.createElement("div");
    wrap.id = "ask-sources";
    ids.forEach(function (nid) {
      var node = nodes[nid];
      if (!node) return;
      var btn = document.createElement("button");
      btn.textContent = node.label;
      btn.style.color = colorOf[node.group];
      // A source chip is part of the same evidence set, so stepping to it keeps
      // the cluster lit rather than collapsing to a single-node selection.
      btn.addEventListener("click", function () { focusNote(nid); });
      wrap.appendChild(btn);
    });
    askAnswer.appendChild(wrap);
  }

  // ---- voice: speaking (speechSynthesis) ------------------------------
  var synth = window.speechSynthesis || null;
  var muteBtn = document.getElementById("ask-mute");
  var micBtn = document.getElementById("ask-mic");
  var statusEl = document.getElementById("ask-status");
  var muted = false;
  var audioUnlocked = false;
  var listening = false;

  function setStatus(kind, text) {
    setReactor(kind || "idle");
    if (!kind) {
      statusEl.className = "";
      statusEl.textContent = "";
      return;
    }
    statusEl.className = "show " + kind;
    statusEl.textContent = "";
    var pip = document.createElement("span");
    pip.className = "pip";
    statusEl.appendChild(pip);
    statusEl.appendChild(document.createTextNode(text));
  }

  // ---- arc reactor ------------------------------------------------------
  // The reactor mirrors whatever setStatus already tracks (idle / listening /
  // thinking / speaking) for colour, and while speaking its brightness is
  // driven from the real audio waveform — see driveReactor below.
  var reactorEl = document.getElementById("reactor");
  var REACTOR_STATES = ["idle", "listening", "thinking", "speaking"];

  function setReactor(state) {
    if (REACTOR_STATES.indexOf(state) === -1) state = "idle";
    reactorEl.className = state;
    // Leaving "speaking" hands --level back to the CSS standby breath; pinning
    // an inline value would override the keyframes and freeze the reactor.
    if (state !== "speaking") {
      stopReactorMeter();
      reactorEl.style.removeProperty("--level");
    }
  }

  // Unlike the browser's speechSynthesis (which exposes no audio buffer at
  // all), Piper hands back a real WAV played through an <audio> element — so
  // the reactor can be driven by actual amplitude instead of a guessed
  // envelope. One AudioContext and one AnalyserNode are reused for the whole
  // session: an element can only be piped into createMediaElementSource once,
  // and each context costs a hardware audio thread.
  var reactorCtx = null;
  var reactorAnalyser = null;
  var reactorBuf = null;
  var reactorFrame = null;
  var reactorLevel = 0;
  var reactorTapped = null; // the <audio> currently wired to the analyser

  function reactorMeterSupported() {
    return typeof (window.AudioContext || window.webkitAudioContext) === "function";
  }

  function ensureReactorCtx() {
    if (reactorCtx) return true;
    if (!reactorMeterSupported()) return false;
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      reactorCtx = new Ctx();
      reactorAnalyser = reactorCtx.createAnalyser();
      // Small FFT: this is a single glow, not a spectrum display, and a short
      // window keeps the reactor responsive to individual syllables.
      reactorAnalyser.fftSize = 256;
      reactorAnalyser.smoothingTimeConstant = 0.75;
      reactorAnalyser.connect(reactorCtx.destination);
      reactorBuf = new Uint8Array(reactorAnalyser.fftSize);
    } catch (e) {
      reactorCtx = null; // no meter this session; the CSS breath still runs
      return false;
    }
    return true;
  }

  // Wire a freshly-created Piper <audio> through the analyser. Falls back
  // silently: if anything here throws, the audio still plays untouched
  // because the element keeps its own default output path until routed.
  function driveReactor(audio) {
    if (!ensureReactorCtx()) return;
    try {
      if (reactorCtx.state === "suspended") reactorCtx.resume();
      if (reactorTapped !== audio) {
        var src = reactorCtx.createMediaElementSource(audio);
        src.connect(reactorAnalyser);
        reactorTapped = audio;
      }
      startReactorMeter();
    } catch (e) {
      // createMediaElementSource throws if this element was already tapped;
      // nothing to recover, the reactor just falls back to the CSS breath.
    }
  }

  function stepReactorMeter() {
    reactorAnalyser.getByteTimeDomainData(reactorBuf);
    // RMS of the waveform around the 128 silence midpoint. Peak would make the
    // reactor twitch on single samples; RMS tracks perceived loudness.
    var sum = 0;
    for (var i = 0; i < reactorBuf.length; i++) {
      var v = (reactorBuf[i] - 128) / 128;
      sum += v * v;
    }
    var rms = Math.sqrt(sum / reactorBuf.length);
    // Speech RMS sits low (~0.05–0.25), so scale it up and curve it to keep
    // quiet consonants visible without pinning the reactor at full on vowels.
    var target = Math.min(1, Math.pow(rms * 3.6, 0.75));
    // Rise fast, fall slow — a jolt on each syllable that eases back down,
    // rather than a jitter that mirrors every zero crossing.
    reactorLevel += (target - reactorLevel) * (target > reactorLevel ? 0.55 : 0.12);
    reactorEl.style.setProperty("--level", reactorLevel.toFixed(3));
    reactorFrame = requestAnimationFrame(stepReactorMeter);
  }

  function startReactorMeter() {
    if (reactorFrame === null) reactorFrame = requestAnimationFrame(stepReactorMeter);
  }

  function stopReactorMeter() {
    if (reactorFrame !== null) cancelAnimationFrame(reactorFrame);
    reactorFrame = null;
    reactorLevel = 0;
  }

  // Fallback animation for the speechSynthesis path, which has no waveform to
  // measure. Word boundaries kick the level up; this loop decays it back down,
  // so the reactor still rides the rhythm of the words even without audio data.
  var REACTOR_FLOOR = 0.16;
  function stepReactorDecay() {
    reactorLevel = Math.max(REACTOR_FLOOR, reactorLevel - 0.045);
    reactorEl.style.setProperty("--level", reactorLevel.toFixed(3));
    reactorFrame = requestAnimationFrame(stepReactorDecay);
  }
  function startReactorDecay() {
    if (reactorFrame === null) reactorFrame = requestAnimationFrame(stepReactorDecay);
  }
  function kickReactor() {
    reactorLevel = 0.85;
  }

  // Chrome refuses to speak until the page has had a real user gesture, and a
  // refused utterance is dropped silently rather than queued. So the very first
  // click on anything primes the engine with an empty utterance; every later
  // speak() then lands. Voices are also loaded async — see pickVoice.
  function unlockAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    if (synth) {
      try {
        var warm = new SpeechSynthesisUtterance(" ");
        warm.volume = 0;
        synth.speak(warm);
      } catch (e) { /* nothing to do — speak() will simply no-op later */ }
    }
    // Piper plays through an <audio> element, which the autoplay policy gates
    // separately from speechSynthesis. Playing a silent clip inside this real
    // gesture marks the document as allowed to make sound.
    try {
      var silent = new Audio(
        "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=");
      silent.volume = 0;
      var p = silent.play();
      if (p && p.catch) p.catch(function () {});
    } catch (e) { /* fallback path still works */ }
  }
  document.addEventListener("pointerdown", unlockAudio, { once: true });
  document.addEventListener("keydown", unlockAudio, { once: true });

  // getVoices() is empty until the engine finishes loading them, so resolve on
  // demand rather than caching a null answer taken at startup.
  var voiceCache = null;
  function pickVoice() {
    if (voiceCache) return voiceCache;
    var voices = synth ? synth.getVoices() : [];
    if (!voices.length) return null;
    var best = null, bestScore = -1;
    voices.forEach(function (v) {
      var lang = (v.lang || "").toLowerCase().replace("_", "-");
      var name = (v.name || "").toLowerCase();
      var score = -1;
      if (lang === "en-gb") score = 3;
      else if (lang.indexOf("en-gb") === 0) score = 3;
      else if (name.indexOf("british") !== -1 || name.indexOf("uk english") !== -1) score = 2;
      else if (lang.indexOf("en") === 0) score = 0;
      if (score < 0) return;
      // Prefer the higher-quality network voices Chrome exposes as non-local.
      if (score >= 2 && !v.localService) score += 0.5;
      if (score > bestScore) { bestScore = score; best = v; }
    });
    if (best) voiceCache = best;
    return best;
  }
  if (synth && typeof synth.addEventListener === "function") {
    synth.addEventListener("voiceschanged", function () { voiceCache = null; pickVoice(); });
  }
  pickVoice();

  // ---- voice: the Piper path -------------------------------------------
  // speechSynthesis on this machine falls through to espeak-ng, which is a
  // formant synthesizer and sounds like a robot no matter how rate and pitch
  // are tuned. So the real voice comes from POST /speak, which returns WAV from
  // a local Piper neural model, and browser speech is kept only as a fallback
  // for when the server has no voice configured.
  var piperAudio = null;      // the <audio> currently playing, if any
  var piperOk = true;         // cleared for the session once /speak 503s
  // Synthesis is async, so a fast second question can resolve after the first.
  // Each request takes a ticket and only the newest one is allowed to play.
  var speakSeq = 0;

  function stopSpeaking() {
    // Escape / a new question can cut speech off without setStatus running,
    // so the meter is stopped here too rather than left spinning on silence.
    stopReactorMeter();
    if (synth) { try { synth.cancel(); } catch (e) {} }
    if (piperAudio) {
      try { piperAudio.pause(); } catch (e) {}
      if (piperAudio.src) URL.revokeObjectURL(piperAudio.src);
      piperAudio = null;
    }
    // Also void any synthesis still in flight, so an Escape (or a new question)
    // is not followed half a second later by the answer it just silenced.
    speakSeq++;
  }

  // Browser speech, used only when Piper is unavailable.
  function speakFallback(text, onDone) {
    if (!synth) { if (onDone) onDone(); return; }
    var utter = new SpeechSynthesisUtterance(text);
    var voice = pickVoice();
    if (voice) { utter.voice = voice; utter.lang = voice.lang; }
    else utter.lang = "en-GB";
    // espeak's default cadence is both fast and flat; slowing it slightly and
    // dropping the pitch is the most that can be done for it.
    utter.rate = 0.95;
    utter.pitch = 0.9;
    var finished = false;
    function done() {
      if (finished) return;
      finished = true;
      if (!listening && !asking) setStatus(null);
      if (onDone) onDone();
    }
    utter.onend = done;
    utter.onerror = done;
    setStatus("speaking", "speaking…");
    // No waveform to meter on this path (speechSynthesis exposes no audio
    // buffer), so approximate the cadence from word boundaries instead: each
    // word kicks the level and it decays back until the next one.
    utter.onboundary = function () { kickReactor(); };
    startReactorDecay();
    synth.speak(utter);
  }

  // The Escape handler is registered above this point in the file, so it reaches
  // stopSpeaking through this hook rather than a forward reference.
  window.__jarvisHush = function () {
    stopSpeaking();
    if (listening && recog) { try { recog.stop(); } catch (e) {} }
    if (!asking) setStatus(null);
  };

  // The full answer is on screen and the source note is open in the panel, so
  // the spoken version only needs to carry the gist. Cap it at the first couple
  // of sentences and strip markdown the engine would otherwise pronounce.
  var SPOKEN_SENTENCES = 2;
  var SPOKEN_CHARS = 320;
  function spokenForm(text) {
    var clean = String(text)
      .replace(/`+/g, "")
      .replace(/\*+/g, "")
      .replace(/\[\[([^\]]*)\]\]/g, "$1")
      .replace(/\s+/g, " ")
      .trim();
    var sentences = clean.match(/[^.!?]+[.!?]*/g) || [clean];
    var out = sentences.slice(0, SPOKEN_SENTENCES).join("").trim();
    if (out.length > SPOKEN_CHARS) {
      out = out.slice(0, SPOKEN_CHARS).replace(/\s+\S*$/, "") + "…";
    }
    return out || clean;
  }

  function speak(text, onDone) {
    if (muted || !text) { if (onDone) onDone(); return; }
    text = spokenForm(text);
    stopSpeaking();

    if (!piperOk) { speakFallback(text, onDone); return; }

    // Synthesis takes about half a second, so the status line says "voicing"
    // rather than "speaking" until audio actually starts — otherwise the label
    // claims sound that has not begun.
    setStatus("speaking", "voicing…");
    var mine = ++speakSeq;

    fetch("/speak", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text })
    })
      .then(function (res) {
        if (res.status === 503) {
          // The server has no voice model. Stop asking for this session.
          piperOk = false;
          throw new Error("fallback");
        }
        if (!res.ok) throw new Error("fallback");
        return res.blob();
      })
      .then(function (blob) {
        // A newer utterance started while this one was synthesizing; drop it
        // rather than talk over the newer answer.
        if (mine !== speakSeq) return;
        var url = URL.createObjectURL(blob);
        var audio = new Audio(url);
        piperAudio = audio;
        var finished = false;
        function done() {
          if (finished) return;
          finished = true;
          URL.revokeObjectURL(url);
          if (piperAudio === audio) piperAudio = null;
          if (!listening && !asking) setStatus(null);
          if (onDone) onDone();
        }
        audio.onended = done;
        audio.onerror = done;
        setStatus("speaking", "speaking…");
        driveReactor(audio);
        var playing = audio.play();
        // Autoplay can still be refused if no gesture has landed yet; the text
        // is already on screen, so a refusal just means no audio this once.
        if (playing && playing.catch) playing.catch(done);
      })
      .catch(function () {
        if (mine !== speakSeq) return;
        speakFallback(text, onDone);
      });
  }

  // ---- boot greeting ---------------------------------------------------
  // Spoken once per page load, with the real note count. Chrome blocks speech
  // until a real user gesture, so this cannot simply fire on load: it is armed
  // here and released by the same first gesture that unlocks the audio engine.
  function greetingText() {
    var hour = new Date().getHours();
    var partOfDay = hour < 12 ? "morning" : (hour < 18 ? "afternoon" : "evening");
    return "Good " + partOfDay + ", sir. " + nodes.length +
           " notes indexed, all present and accounted for.";
  }

  var greeted = false;
  function bootGreeting() {
    if (greeted) return;
    greeted = true;
    var text = greetingText();
    showAnswer(text, false);
    speak(text);
  }

  // The greeting is text on screen either way; only the spoken half waits for
  // a gesture. Show it now, and let the first click or keypress voice it.
  // Piper plays through an <audio> element, so this no longer requires synth —
  // either path can voice the greeting once a gesture has landed.
  if (!muted) {
    if (audioUnlocked) bootGreeting();
    else {
      showAnswer(greetingText(), false);
      document.addEventListener("pointerdown", function () {
        // unlockAudio's own once-handler runs first and primes the engine; a
        // beat later the utterance lands rather than being dropped silently.
        setTimeout(bootGreeting, 250);
      }, { once: true });
      document.addEventListener("keydown", function () {
        setTimeout(bootGreeting, 250);
      }, { once: true });
    }
  } else {
    showAnswer(greetingText(), false);
    greeted = true;
  }

  muteBtn.addEventListener("click", function () {
    muted = !muted;
    muteBtn.classList.toggle("muted", muted);
    muteBtn.innerHTML = muted ? "&#128263;" : "&#128266;";
    muteBtn.setAttribute("aria-label", muted ? "Unmute spoken answers" : "Mute spoken answers");
    muteBtn.title = muteBtn.getAttribute("aria-label");
    if (muted) { stopSpeaking(); if (!listening && !asking) setStatus(null); }
  });

  // ---- voice: listening (webkitSpeechRecognition) ----------------------
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  var recog = null;
  var heardFinal = "";

  if (!SR) {
    micBtn.disabled = true;
    micBtn.title = "Speech recognition needs Chrome (or Edge)";
    micBtn.setAttribute("aria-label", micBtn.title);
  } else {
    recog = new SR();
    recog.lang = "en-GB";
    recog.interimResults = true;
    recog.continuous = false;
    recog.maxAlternatives = 1;

    recog.onstart = function () {
      listening = true;
      heardFinal = "";
      micBtn.classList.add("listening");
      setStatus("listening", "listening…");
    };

    recog.onresult = function (event) {
      var interim = "";
      for (var i = event.resultIndex; i < event.results.length; i++) {
        var chunk = event.results[i][0].transcript;
        if (event.results[i].isFinal) heardFinal += chunk;
        else interim += chunk;
      }
      // Show the words landing in the input so the user can see it heard them.
      askInput.value = (heardFinal + interim).trim();
    };

    recog.onerror = function (event) {
      listening = false;
      micBtn.classList.remove("listening");
      var msg = {
        "not-allowed": "Microphone access was blocked. Allow it in the address-bar icon and try again.",
        "service-not-allowed": "Microphone access was blocked by the browser.",
        "no-speech": "Didn't catch anything — tap the mic and speak again.",
        "audio-capture": "No microphone found."
      }[event.error];
      setStatus(null);
      if (msg) showAnswer(msg, true);
    };

    // onend always fires, including after a successful result, so the send
    // happens here — that way a stop() or a natural pause both submit once.
    recog.onend = function () {
      listening = false;
      micBtn.classList.remove("listening");
      var said = (heardFinal || askInput.value).trim();
      if (said) {
        askInput.value = said;
        ask();
      } else if (!asking) {
        setStatus(null);
      }
    };

    micBtn.addEventListener("click", function () {
      unlockAudio();
      if (listening) { recog.stop(); return; }
      // Never listen to our own voice coming out of the speakers.
      stopSpeaking();
      try {
        recog.start();
      } catch (e) {
        // start() throws if the engine is still winding down from the last run.
        setStatus(null);
      }
    });
  }

  // "remember that ..." is a capture, not a question — it goes to /remember,
  // which writes a real note. Matched here as well as server-side so the page
  // can show "Filing…" rather than "Reading your notes…" while it waits.
  var REMEMBER_RE =
    /^\s*(?:jarvis[\s,]+)?remember\s+(?:that|this|to)?\s*[:,-]?\s*([\s\S]+)$/i;

  function remember(text) {
    asking = true;
    askBox.classList.add("busy");
    askSend.disabled = true;

    var waited = 0;
    setStatus("thinking", "filing…");
    showAnswer("Filing that away…", false);
    var tick = setInterval(function () {
      waited += 1;
      askAnswer.textContent = "Filing that away… " + waited + "s";
    }, 1000);

    fetch("/remember", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text })
    })
      .then(function (res) {
        return res.text().then(function (raw) {
          if (!raw) {
            if (res.status === 404 || res.status === 405) throw new Error(WRONG_SERVER);
            throw new Error("The server closed the connection before filing that.");
          }
          try {
            return { ok: res.ok, data: JSON.parse(raw) };
          } catch (e) {
            throw new Error("Unreadable reply from the server (HTTP " + res.status + ").");
          }
        });
      })
      .then(function (result) {
        if (!result.ok) throw new Error(result.data.error || "Could not file that.");
        var born = birthNode(result.data.node, result.data.anchor,
                             result.data.related);
        showAnswer(result.data.answer, false);
        speak(result.data.answer);
        if (born) {
          // Select before pulsing: the pulse hands the scale back to
          // applyHighlight when it finishes, which needs the node already lit.
          select(born.id, true);
          // The sprite only exists once the graph has rebuilt its objects, so
          // the pulse waits a frame for nodeObject to have run.
          requestAnimationFrame(function () { pulse(born); });
        }
        askInput.value = "";
      })
      .catch(function (err) {
        var msg = err.message || "Could not reach the server.";
        showAnswer(msg, true);
        setStatus(null);
        speak(msg);
      })
      .then(function () {
        clearInterval(tick);
        asking = false;
        askBox.classList.remove("busy");
        askSend.disabled = false;
        if (!listening && !(synth && synth.speaking)) setStatus(null);
        askInput.focus();
      });
  }

  function ask() {
    var question = askInput.value.trim();
    if (!question || asking) return;

    var capture = REMEMBER_RE.exec(question);
    if (capture && capture[1].trim()) {
      remember(capture[1].trim());
      return;
    }

    asking = true;
    askBox.classList.add("busy");
    askSend.disabled = true;

    // The server shells out to `claude -p`, which routinely takes 15-30s.
    // Without a ticking label the page looks hung, which is what makes people
    // hit Enter again and pile up requests.
    var waited = 0;
    setStatus("thinking", "thinking…");
    showAnswer("Reading your notes…", false);
    var tick = setInterval(function () {
      waited += 1;
      askAnswer.textContent = "Reading your notes… " + waited + "s";
    }, 1000);

    var body = { question: question };
    if (sessionId) body.session_id = sessionId;

    fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    })
      .then(function (res) {
        // Read as text first: a dropped or truncated response yields an empty
        // body, and res.json() would surface that as an opaque parse error.
        return res.text().then(function (raw) {
          if (!raw) {
            // 404/405 with an empty body means this page is being served by a
            // plain static server that has no /chat route — almost always the
            // VS Code Live Server on :5500 rather than server.py on :4700.
            if (res.status === 404 || res.status === 405) throw new Error(WRONG_SERVER);
            throw new Error(
              "The server closed the connection before answering. " +
              "It may still be thinking — try again."
            );
          }
          try {
            return { ok: res.ok, data: JSON.parse(raw) };
          } catch (e) {
            throw new Error("Unreadable reply from the server (HTTP " + res.status + ").");
          }
        });
      })
      .then(function (result) {
        if (!result.ok) throw new Error(result.data.error || "Request failed.");
        sessionId = result.data.session_id || sessionId;
        showAnswer(result.data.answer, false);
        showSources(result.data.nodes);
        speak(result.data.answer);
        // Light up the notes the answer actually drew on.
        if (result.data.nodes && result.data.nodes.length) {
          showEvidence(result.data.nodes);
        }
        askInput.value = "";
      })
      .catch(function (err) {
        var msg = err.message || "Could not reach the server.";
        showAnswer(msg, true);
        setStatus(null);
        speak(msg);
      })
      .then(function () {
        clearInterval(tick);
        asking = false;
        askBox.classList.remove("busy");
        askSend.disabled = false;
        // speak() owns the status line once an answer lands; only clear it here
        // if nothing is being spoken, so "speaking…" isn't wiped immediately.
        if (!listening && !(synth && synth.speaking)) setStatus(null);
        askInput.focus();
      });
  }

  // Warn on load rather than after the user types a question and waits. This
  // outranks the boot greeting — there is no point being charming about a
  // vault the page cannot reach — so it also cancels the pending spoken one.
  if (location.port !== CHAT_PORT && location.protocol !== "https:") {
    askInput.placeholder = "Open http://localhost:" + CHAT_PORT + " to ask questions";
    greeted = true;
    showAnswer(WRONG_SERVER, true);
  }

  askSend.addEventListener("click", ask);
  askInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); ask(); }
    // Escape clears the ask bar without also collapsing the graph selection.
    if (e.key === "Escape" && askInput.value) { e.stopPropagation(); askInput.value = ""; }
  });

  // ---- reveal ---------------------------------------------------------
  Graph.onEngineStop(function () {
    var l = document.getElementById("loading");
    if (l && !l.__done) {
      l.__done = true;
      l.style.opacity = "0";
      setTimeout(function () { l.remove(); }, 800);
    }
  });
  setTimeout(function () {
    var l = document.getElementById("loading");
    if (l && !l.__done) { l.__done = true; l.style.opacity = "0"; setTimeout(function(){ l.remove(); }, 800); }
  }, 4000);

  window.addEventListener("resize", function () {
    Graph.width(window.innerWidth).height(window.innerHeight);
  });
  Graph.width(window.innerWidth).height(window.innerHeight);
})();
</script>
</body>
</html>
